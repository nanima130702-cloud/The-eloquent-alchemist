<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>口八丁の錬金術師</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a14;--fg:#f8f4ec;--card:#1b1830;--bd:#3d3858;--pri:#fbbf24;--mut:#94a3b8;--en:#fb7185;--ok:#34d399;--vi:#c4b5fd;--fu:#e879f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);color:var(--fg);font-family:'DotGothic16','Noto Sans JP',system-ui,sans-serif;background-image:linear-gradient(#a855f71a 1px,transparent 1px),linear-gradient(90deg,#a855f71a 1px,transparent 1px);background-size:16px 16px;min-height:100dvh;line-height:1.6}
button,input{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:14px 12px 40px;display:flex;flex-direction:column;gap:12px}
.panel{width:100%;border:2px solid #4a4468;background:var(--card);padding:12px;box-shadow:4px 4px 0 #0b0a14e6}
.sm{font-size:11px;color:var(--mut);letter-spacing:.08em;font-weight:700}
.btn{border:2px solid #0b0a14;background:var(--pri);color:#1a1405;font-weight:900;padding:12px 16px;cursor:pointer;box-shadow:3px 3px 0 #0b0a14e6;width:100%;font-size:16px}
.btn:active{transform:translate(2px,2px)}
.ghost{border:1px solid #ffffff26;background:transparent;color:#cbd5e1;padding:9px;cursor:pointer;font-size:12px;font-weight:700;flex:1}
.ghost:hover{background:#ffffff0d}
.vio{border:2px solid #c4b5fd99;background:#8b5cf626;color:#ede9fe;font-weight:900;padding:6px 10px;cursor:pointer;font-size:12px}
h1{font-size:44px;line-height:1.15;color:#fde68a;margin:8px 0;text-shadow:3px 3px 0 #0b0a14,6px 6px 0 #fbbf2459;text-align:center}
.row{display:flex;gap:8px;align-items:center}
.bar{height:16px;border:2px solid #0b0a14;background:#1e293b;overflow:hidden}
.bar i{display:block;height:100%;transition:width .5s}
.cc{border:1px solid #ffffff1a;background:#0b0a1480;padding:10px;animation:pop .3s steps(3,end) both}
.cc.dim{opacity:.5}.empty{border:1px dashed #fff3;padding:20px;text-align:center;color:var(--mut);font-size:13px}
.sp{width:112px;height:112px;border:3px solid;box-shadow:0 0 8px currentColor;padding:3px;flex:none}
.sp svg{width:100%;height:100%;display:block}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
.log{border:1px solid #ffffff1a;background:#0f0d1ccc;padding:8px 12px;font-weight:700;font-size:14px}
.log.mu{border-color:#e879f999;background:#d946ef26}
.tag{background:#d946ef;color:#fff;font-size:10px;padding:1px 6px;margin-right:6px}
.ch{display:flex;width:100%;align-items:center;gap:10px;border:2px solid;padding:9px 10px;text-align:left;cursor:pointer;margin-bottom:8px;background:#ffffff0d}
.ch b{flex:none;width:72px;text-align:center;font-size:11px;padding:3px 0;color:#111}
.ch.off{opacity:.55}.ch small{display:block;font-size:10px;color:#cbd5e1cc}
.ch kbd{margin-left:auto;border:1px solid #fff3;padding:2px 7px;font-size:12px}
.nt{border:1px solid;padding:8px 12px;font-size:13px;font-weight:700;margin:6px 0}
.nt.fail{border-color:#fb7185aa;background:#f43f5e26}.nt.ok{border-color:#34d399aa;background:#10b98126}
.tabs{display:flex;gap:4px;border:2px solid #ffffff1a;padding:4px;background:#0f0d1cb3}
.tabs button{flex:1;border:0;padding:8px 2px;font-size:12px;font-weight:700;background:transparent;color:#cbd5e1;cursor:pointer}
.tabs .on{background:var(--pri);color:#1a1405}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sb{border:1px solid #ffffff26;background:#0f0d1ccc;padding:8px;text-align:left;cursor:pointer;min-height:68px}
.sb:hover{border-color:#fbbf2499}
input[type=text]{flex:1;min-height:52px;border:1px solid #ffffff26;background:#0f0d1ccc;padding:0 12px;font-size:16px;outline:0}
dialog{background:var(--card);color:var(--fg);border:2px solid #c4b5fd66;max-width:520px;width:calc(100% - 24px);max-height:85dvh;padding:0}
dialog::backdrop{background:#000a}
.dx{display:flex;gap:10px;border:2px solid;padding:6px;margin:8px}
.pips span{display:inline-block;width:20px;height:10px;border-radius:5px;background:#334155;margin-right:4px}.pips .f{background:#34d399}
ol{padding-left:20px;margin:6px 0;font-size:13px}
.mt{display:flex;align-items:center;gap:8px;font-size:11px;margin:4px 0}.mt .b{flex:1;height:10px;background:#1e293b;border-radius:5px;overflow:hidden}.mt .b i{display:block;height:100%}
.g4{grid-template-columns:repeat(4,1fr);gap:6px}.g4 .sb{padding:5px;min-height:0;text-align:center}.g4 .sb b{font-size:11px!important;line-height:1.2;display:block}.g4 .sb div{font-size:9px!important}.g4 .sp{margin:0 auto 4px}
:focus-visible{outline:4px solid #fff;outline-offset:3px}
.btn:hover,.ch:hover,.sb:hover,.vio:hover,.ghost:hover{outline:3px solid #fbbf24;outline-offset:2px}
.sb,.ghost{border-width:2px;border-color:#ffffffb3}
.big body{zoom:1.3}
.mq{animation:mq 15s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
</style>
</head>
